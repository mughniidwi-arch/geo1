<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MathJong Splash</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;500;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --bg:#1c1f23; --stage:#2b2e34; --surface:#23262b; --track:#34383e;
  --ink:#f4f3ef; --muted:#8b9099; --tile:#f4f3ef; --tile-ink:#1c1f23;
  --font:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--stage);font-family:var(--font);color:var(--ink);display:grid;place-items:center}

.splash{
  position:relative;width:100%;height:100%;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  overflow:hidden;cursor:pointer;
}
@media (min-width:600px){
  .splash{width:360px;height:720px;border-radius:36px;box-shadow:0 30px 60px rgba(0,0,0,.45)}
}
.splash::before{ /* soft glow behind logo */
  content:"";position:absolute;width:320px;height:320px;border-radius:50%;
  background:radial-gradient(circle,rgba(244,243,239,.07),transparent 65%);
  top:50%;left:50%;transform:translate(-50%,-62%);
}

.logo{position:relative;width:176px;height:176px;display:grid;place-items:center}
.logo svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.track{fill:none;stroke:var(--track);stroke-width:8}
.arc{fill:none;stroke:var(--ink);stroke-width:8;stroke-linecap:round;
  stroke-dasharray:490;stroke-dashoffset:490;animation:draw 2.8s cubic-bezier(.6,.05,.25,1) .5s forwards}
.knob{fill:var(--bg);stroke:var(--ink);stroke-width:3}

.tile{
  width:84px;height:104px;border-radius:22px;background:var(--tile);color:var(--tile-ink);
  display:grid;place-items:center;position:relative;
  box-shadow:0 10px 0 -2px #b9b8b3, 0 22px 30px rgba(0,0,0,.4);
  animation:rise .9s cubic-bezier(.2,.8,.2,1) both;
}
.tile b{font-size:56px;font-weight:800;letter-spacing:-.04em;line-height:1}
.tile i{position:absolute;top:10px;left:11px;width:6px;height:6px;border-radius:50%;background:var(--tile-ink);opacity:.9}
.tile i+i{left:auto;right:11px;top:auto;bottom:10px}

.word{margin-top:44px;font-size:34px;letter-spacing:-.02em;animation:fade 1s ease .9s both}
.word span{font-weight:200}
.word strong{font-weight:800}
.tag{margin-top:10px;font-size:13px;font-weight:300;letter-spacing:.14em;color:var(--muted);animation:fade 1s ease 1.2s both}

.foot{position:absolute;bottom:calc(36px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font-size:12px;color:var(--muted);animation:fade 1s ease 1.4s both}
.foot em{font-style:normal;color:var(--ink);font-variant-numeric:tabular-nums}

@keyframes draw{to{stroke-dashoffset:0}}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.92)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}
</style>
</head>
<body>
<main class="splash" id="splash" title="Ketuk untuk memutar ulang">
  <div class="logo">
    <svg viewBox="0 0 176 176" aria-hidden="true">
      <circle class="track" cx="88" cy="88" r="78"/>
      <circle class="arc" cx="88" cy="88" r="78"/>
    </svg>
    <div class="tile"><i></i><i></i><b>7</b></div>
  </div>
  <h1 class="word"><span>Math</span><strong>Jong</strong></h1>
  <p class="tag">Hitung. Cocokkan. Menang.</p>
  <p class="foot">Memuat <em id="pct">0</em>%</p>
</main>
<script>
(function(){
  var pct=document.getElementById('pct'),t0;
  function run(){
    t0=null;
    (function step(ts){
      if(!t0)t0=ts;
      var p=Math.min(Math.max((ts-t0-500)/2800,0),1);
      var e=p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
      pct.textContent=Math.round(e*100);
      if(p<1)requestAnimationFrame(step);
    })(performance.now());
  }
  run();
  document.getElementById('splash').addEventListener('click',function(){location.reload()});
})();
</script>
</body>
</html>
